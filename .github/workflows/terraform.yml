name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - feature/test

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        #with:
          #terraform_version: 1.9.8

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Check Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -input=false


  # ============================================================
  # TERRAFORM APPLY
  # ONLY ON MAIN BRANCH
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    needs:
      - terraform-plan

    runs-on: ubuntu-latest

    # Apply ONLY when:
    # 1. Workflow was triggered by a push
    # 2. Push was made to main branch

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    defaults:
      run:
        working-directory: environment/dev

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Check Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve